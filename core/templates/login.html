{% extends 'cab.html' %}
{% load static %}

{% block content %}
<style>
/* Centraliza o card */
.login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
}

/* Card moderno */
.login-card {
    background: #1c1c1c;
    padding: 40px 30px;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 400px;
    color: #fff;
}

.login-card h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #d4af37;
    font-family: 'Segoe UI', sans-serif;
}

.login-card label {
    font-weight: bold;
    margin-bottom: 5px;
    display: block;
}

.login-card input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 1rem;
    background-color: #111;
    color: #ffd700;
}

.login-card button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 1rem;
    background-color: #d4af37;
    color: #111;
    border: none;
    cursor: pointer;
    transition: background 0.3s;
}

.login-card button:hover {
    background-color: #ffd700;
}

.login-card .error {
    background-color: #ff4d4d;
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 15px;
    text-align: center;
    font-weight: bold;
    color: #fff;
}
</style>

<div class="login-container">
    <div class="login-card" id="login-card">
        <h2>Login</h2>
        
        {% if form.errors %}
        <div class="error">
            Usuário ou senha inválidos
        </div>
        {% endif %}

        <form id="formLogin" autocomplete="off">
            {% csrf_token %}
            <label>Username</label>
            <input type="text" name="username" id="username" required autocomplete="off">

            <label>Senha</label>
            <input type="password" name="password" id="password" required autocomplete="off">

            <button type="submit">Entrar</button>
        </form>


    </div>
</div>

<!-- MODAL DE SUCESSO -->
<div id="modalSucesso" class="modal-custom" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index:9999;">
    <div style="background:#1c1c1c; padding:30px; border-radius:12px; text-align:center; width:350px; color:#fff; border:2px solid #d4af37;">
        <h3 style="color:#d4af37;">✔ Login realizado!</h3>
        <p>Estamos redirecionando...</p>
    </div>
</div>

<!-- TOAST DE ERRO -->
<div id="toastErro" style="
    display:none;
    position:fixed;
    bottom:150px;
    right:20px;
    background:#ff4d4d;
    padding:15px 20px;
    border-radius:8px;
    color:#fff;
    font-weight:bold;
    z-index:9999;
    box-shadow:0 0 10px #000;
">
    Usuário ou senha inválidos.
</div>


<script>
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(";");
        for (let cookie of cookies) {
            cookie = cookie.trim();
            if (cookie.startsWith(name + "=")) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
const csrftoken = getCookie("csrftoken");

document.getElementById("formLogin").addEventListener("submit", function(e) {
    e.preventDefault();

    // 🔥 Fecha qualquer autocomplete aberto
    document.activeElement.blur();

    const modal = document.getElementById("modalSucesso");
    const toast = document.getElementById("toastErro");

    modal.querySelector("h3").innerHTML = "🔄 Verificando...";
    modal.querySelector("p").innerHTML = "Aguarde...";
    modal.style.display = "flex";


    let formData = new FormData(this);

    fetch("", {
        method: "POST",
        headers: {
            "X-Requested-With": "XMLHttpRequest",
            "X-CSRFToken": csrftoken
        },
        body: formData
    })
    .then(r => r.json())
    .then(data => {

        if (data.success) {
            modal.querySelector("h3").innerHTML = "✔ Login realizado!";
            modal.querySelector("p").innerHTML = "Redirecionando...";

            setTimeout(() => {
                window.location.href = "{% url 'vender' %}#txt-caixa";
            }, 1500);

        } else {
            modal.style.display = "none";

            toast.innerHTML = data.error;
            toast.style.display = "block";

            setTimeout(() => {
                toast.style.display = "none";
            }, 3000);
        }
    })
    .catch(err => {
        modal.style.display = "none";
        toast.innerHTML = "Erro inesperado. Tente novamente.";
        toast.style.display = "block";
        setTimeout(() => {
            toast.style.display = "none";
        }, 3000);
    });
});
</script>




{% endblock %}
